    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        .fullscreen-window {
            z-index: 1000; /* Un niveau de z-index supérieur pour être au-dessus des autres éléments */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; /* Utilise 100% de la largeur de la fenêtre */
            height: 100vh; /* Utilise 100% de la hauteur de la fenêtre */
            background-color: rgba(0, 0, 0, 0.8); /* Fond sombre */
        }

        .window-title-bar {
            position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.85) 40%, rgba(0, 0, 0, 0.3) 80%, transparent);
    display: none;
    z-index: 2000;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.exit-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.95) 30%, rgba(0, 0, 0, 0.6) 60%, rgba(0, 0, 0, 0.3) 85%, transparent);
    z-index: 3000;
    transition: opacity 0.3s ease;
}


.exit-content {
    position: absolute;
    top: 50%;
    left: 5%;
    transform: translateY(-50%);
}

.exit-content h2 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

.app-label {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    opacity: 0.7;
}

.quit-app-button {
    background: none;
    border: 2px solid white;
    color: white;
    padding: 15px 30px;
    font-size: 1.2rem;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.quit-app-button.hover {
    background-color: white;
    color: black;
}


        .app-frame {
            width: 100%; /* Remplir toute la largeur */
            height: calc(100%); /* Ajuster pour la hauteur de la barre de titre */
            border: none; /* Pas de bordure pour l'iframe */
        }

        .window-button {
            width: 20px;
            height: 20px;
            background-color: rgba(117, 45, 45, 0.466); /* Couleur du bouton de fermeture */
            cursor: pointer; /* Indicateur de survol */
        }

        .menu-dropdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            transform: translateX(-100%); /* Cacher par défaut */
            transition: transform 0.3s ease;
            z-index: 1001; /* Au-dessus de la fenêtre */
        }

        .menu-dropdown.active {
            transform: translateX(0); /* Afficher le menu */
        }

        .menu-dropdown ul {
            list-style: none;
            padding: 20px;
            margin: 0;
        }

        .menu-dropdown li {
            padding: 10px 0;
            cursor: pointer;
        }

        .menu-icon {
            cursor: pointer;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #222;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

    <script>
        let zIndex = 1;
        let menuEnabled = true;
        let keyPressTimer = null;
        let buttonPressTimer = null;
        let overlayShown = false;
    function playSoundEffect() {
    const audio = document.getElementById('soundEffect');
    if (audio) {
        audio.currentTime = 0; // remet au début
        audio.play().catch(e => console.warn("Son bloqué par le navigateur"));
    }
}

function openApp(url, appName, element) {
    if (!menuEnabled) return;
 playSoundEffect();
    const sourisMode = element.getAttribute('data-souris');
    const manetteMode = element.getAttribute('data-manette');

    console.log(`Ouverture de ${appName} - Souris: ${sourisMode}, Manette: ${manetteMode}`);

    const appWindow = document.createElement('div');
    appWindow.className = 'fullscreen-window';
    appWindow.style.zIndex = zIndex++;

    appWindow.innerHTML = `
        <div class="exit-overlay hidden" id="exitOverlay">
            <div class="exit-content">
                <h2>Vous nous quittez ?</h2>
                <p class="app-label">Application en cours : ${appName}</p>
                <button class="quit-app-button" onclick="confirmExit()">Quitter l’applis</button>
            </div>
        </div>

        <iframe src="${url}" class="app-frame"></iframe>
        <div class="menu-dropdown" id="dropdownMenu">
            <ul>
                <li onclick="closeApp(this.closest('.fullscreen-window'))">Fermer le Jeu</li>
            </ul>
        </div>
    `;

    document.body.appendChild(appWindow);
    menuEnabled = false;

    if (appWindow.requestFullscreen) {
        appWindow.requestFullscreen();
    }

    setupLongPressClose(appWindow);

    // ICI ! → souris mode uniquement dans l'appWindow
    if (sourisMode === 'on') {
        enableGamepadMouseMode(appWindow);
    }
}

        function confirmExit() {
            const appWindow = document.querySelector('.fullscreen-window');
            const exitOverlay = appWindow.querySelector('#exitOverlay');

        }
    
function closeApp(appWindow) {
    document.body.removeChild(appWindow);
    menuEnabled = true;
    overlayShown = false;
    disableGamepadMouseMode();

    setTimeout(() => previousAButtonPressed = true, 50); // ← ajoute ça
}


        function showExitOverlay() {
            const appWindow = document.querySelector('.fullscreen-window');
            if (!appWindow) return;
    
            const exitOverlay = appWindow.querySelector('#exitOverlay');
    
            if (!overlayShown) {
                exitOverlay.classList.remove('hidden');
                exitOverlay.classList.add('active');
                overlayShown = true;
            }
        }
let gamepadMouseActive = false;
let cursorElement = null;
let cursorX = window.innerWidth / 2;
let cursorY = window.innerHeight / 2;
let gamepadMouseLoopId = null;
let currentAppWindow = null; // On mémorise la fenêtre courante !
let previousAButtonPressed = false;

function enableGamepadMouseMode(appWindow) {
    if (gamepadMouseActive) return;

    currentAppWindow = appWindow; // On mémorise l'appWindow actuelle

    cursorElement = document.createElement('div');
    cursorElement.id = 'gamepad-cursor';
    cursorElement.style.position = 'absolute';
    cursorElement.style.width = '20px';
    cursorElement.style.height = '20px';
    cursorElement.style.borderRadius = '50%';
    cursorElement.style.background = 'white';
    cursorElement.style.zIndex = 999999;
    cursorElement.style.pointerEvents = 'none';
    cursorElement.style.left = `${cursorX}px`;
    cursorElement.style.top = `${cursorY}px`;

    appWindow.appendChild(cursorElement);

    gamepadMouseActive = true;
    previousAButtonPressed = false; // on reset

    gamepadMouseLoop(); // IMPORTANT !! On démarre la boucle ici
}

function disableGamepadMouseMode() {
    if (!gamepadMouseActive) return;

    if (cursorElement && cursorElement.parentNode) cursorElement.parentNode.removeChild(cursorElement);
    cursorElement = null;
    gamepadMouseActive = false;
    if (gamepadMouseLoopId) cancelAnimationFrame(gamepadMouseLoopId);
    gamepadMouseLoopId = null;
    currentAppWindow = null; // On reset aussi
}

function gamepadMouseLoop() {
    if (!gamepadMouseActive || !currentAppWindow) return;

    const gamepads = navigator.getGamepads();
    const gp = gamepads[0];
    if (gp) {
        const speed = 10;
        const deadzone = 0.15; // pour éviter les micro-mouvements involontaires

        // Lecture du stick gauche
        const leftStickX = Math.abs(gp.axes[0]) > deadzone ? gp.axes[0] : 0;
        const leftStickY = Math.abs(gp.axes[1]) > deadzone ? gp.axes[1] : 0;

        cursorX += leftStickX * speed;
        cursorY += leftStickY * speed;

        // Limiter le curseur à la fenêtre
        const rect = currentAppWindow.getBoundingClientRect();
        cursorX = Math.max(0, Math.min(rect.width, cursorX));
        cursorY = Math.max(0, Math.min(rect.height, cursorY));

        cursorElement.style.left = `${cursorX}px`;
        cursorElement.style.top = `${cursorY}px`;

        // Gestion du clic A / X
        const aButton = gp.buttons[0];
        const aButtonPressed = aButton?.pressed || aButton?.value > 0.5;

        if (aButtonPressed && !previousAButtonPressed) {
            // Trouver la cible sous le curseur (en coordonnées absolues)
            const target = document.elementFromPoint(cursorX + rect.left, cursorY + rect.top);
            if (target && target !== cursorElement) {
                console.log("Simuler clic gauche sur :", target);

                // Créer un MouseEvent click
                const mouseEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: cursorX + rect.left,
                    clientY: cursorY + rect.top,
                    button: 0 // bouton gauche
                });

                target.dispatchEvent(mouseEvent);
            }
        }

        previousAButtonPressed = aButtonPressed;
    }

    gamepadMouseLoopId = requestAnimationFrame(gamepadMouseLoop);
}

function applyControlModes(sourisMode, manetteMode) {
    if (sourisMode === 'on') {
        enableGamepadMouseMode();
    } else {
        disableGamepadMouseMode();
    }

    // manetteMode : pour l'instant on ne fait rien
    console.log(`Mode manette : ${manetteMode}`);
}

        function setupLongPressClose(appWindow) {
            let pressTimer;
            const dropdownMenu = appWindow.querySelector('#dropdownMenu');
    
            // Gamepad connected
            window.addEventListener('gamepadconnected', () => {
                console.log("Manette connectée");
            });
    
            function checkRightStick() {
                const gamepads = navigator.getGamepads();
                if (gamepads[0]) {
                    const axes = gamepads[0].axes;
                    if (axes[2] > 0.5) {
                        if (!pressTimer) {
                            pressTimer = setTimeout(() => {
                                dropdownMenu.classList.add('active');
                                appWindow.style.zIndex = zIndex++;
                            }, 5000);
                        }
                    } else {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                        dropdownMenu.classList.remove('active');
                    }
                }
                requestAnimationFrame(checkRightStick);
            }
            checkRightStick();
        }

const dpadDown = gp.buttons[13]?.pressed;
const dpadLeft = gp.buttons[14]?.pressed;
const dpadRight = gp.buttons[15]?.pressed;

if (!buttonFocused && (dpadUp || dpadDown || dpadLeft || dpadRight)) {

// Boucle de contrôle continue
function monitorOverlayGamepad() {

}
monitorOverlayGamepad();

window.addEventListener('keydown', (e) => {

let buttonFocused = false;
const moveThreshold = 0.3;

function monitorGamepadInput() {
    const gamepads = navigator.getGamepads();
    const gp = gamepads[0];
    if (!gp || !document.querySelector('#exitOverlay.active')) return;

    // D-pad
    const dpadUp = gp.buttons[12]?.pressed;
    const dpadDown = gp.buttons[13]?.pressed;
    const dpadLeft = gp.buttons[14]?.pressed;
    const dpadRight = gp.buttons[15]?.pressed;

    // Joystick droit
    const rightStickX = gp.axes[2];
    const rightStickY = gp.axes[3];

    if (!buttonFocused && (dpadUp || dpadDown || dpadLeft || dpadRight || Math.abs(rightStickX) > moveThreshold || Math.abs(rightStickY) > moveThreshold)) {
        quitButton.classList.add('hover');
        buttonFocused = true;
    }

    // A / Croix
    if (gp.buttons[0]?.pressed && buttonFocused) {
        confirmExit();
        buttonFocused = false;
    }

    // B / Rond
    if (gp.buttons[1]?.pressed) {
        const exitOverlay = document.querySelector('#exitOverlay');
        if (exitOverlay) {
            exitOverlay.classList.add('hidden');
            exitOverlay.classList.remove('active');
            buttonFocused = false;
        }
    }

    requestAnimationFrame(monitorGamepadInput);
}

function hoverWithGamepad() {
    if (!menuEnabled) return; // ← Empêche tout mouvement si app ouverte
    const gamepads = navigator.getGamepads();
    if (gamepads[0]) {
        const axes = gamepads[0].axes;

        const menu = document.querySelector('.main-menu');

if (axes[0] > 0.5 && !isMoving) {

    updateSelection();
    centerOnSelected(menu, itemWidth);
    playSoundEffect(); // <-- ICI
    isMoving = true;
} else if (axes[0] < -0.5 && !isMoving) {

    updateSelection();
    centerOnSelected(menu, itemWidth);
    playSoundEffect(); // <-- ICI
    isMoving = true;
}
 else if (Math.abs(axes[0]) < 0.2) {

if (buttons[0].pressed) {

    }
