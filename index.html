<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="console-style.css">
    <title>Console Style</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        .fullscreen-window {
            z-index: 1000; /* Un niveau de z-index supérieur pour être au-dessus des autres éléments */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw; /* Utilise 100% de la largeur de la fenêtre */
            height: 100vh; /* Utilise 100% de la hauteur de la fenêtre */
            background-color: rgba(0, 0, 0, 0.8); /* Fond sombre */
        }

        .window-title-bar {
            position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.85) 40%, rgba(0, 0, 0, 0.3) 80%, transparent);
    display: none;
    z-index: 2000;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.exit-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: linear-gradient(to right, rgba(0, 0, 0, 0.95) 30%, rgba(0, 0, 0, 0.6) 60%, rgba(0, 0, 0, 0.3) 85%, transparent);
    z-index: 3000;
    transition: opacity 0.3s ease;
}


.exit-content {
    position: absolute;
    top: 50%;
    left: 5%;
    transform: translateY(-50%);
}

.exit-content h2 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

.app-label {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    opacity: 0.7;
}

.quit-app-button {
    background: none;
    border: 2px solid white;
    color: white;
    padding: 15px 30px;
    font-size: 1.2rem;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.quit-app-button:hover {
    background-color: white;
    color: black;
}

        .app-frame {
            width: 100%; /* Remplir toute la largeur */
            height: calc(100%); /* Ajuster pour la hauteur de la barre de titre */
            border: none; /* Pas de bordure pour l'iframe */
        }

        .window-button {
            width: 20px;
            height: 20px;
            background-color: rgba(117, 45, 45, 0.466); /* Couleur du bouton de fermeture */
            cursor: pointer; /* Indicateur de survol */
        }

        .menu-dropdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            transform: translateX(-100%); /* Cacher par défaut */
            transition: transform 0.3s ease;
            z-index: 1001; /* Au-dessus de la fenêtre */
        }

        .menu-dropdown.active {
            transform: translateX(0); /* Afficher le menu */
        }

        .menu-dropdown ul {
            list-style: none;
            padding: 20px;
            margin: 0;
        }

        .menu-dropdown li {
            padding: 10px 0;
            cursor: pointer;
        }

        .menu-icon {
            cursor: pointer;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #222;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* Section pour la description et le bouton */
/* Section pour la description et le bouton */
.description-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    width: 100%;
    box-sizing: border-box;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    color: white;
}
.hidden {
    display: none !important;
}

.title-left h1 {
    font-size: 8rem; /* Taille du titre */
    font-weight: bold;
    margin: 0;
}

.description-right {
    text-align: right;
    max-width: 500px; /* Limite la largeur de la description */
}

.description-right p {
    font-size: 1.2rem; /* Taille du texte */
    margin: 0;
}

.launch-button {
    margin-top: 10px;
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.launch-button:hover {
    background-color: #0056b3;
}

    </style>
</head>
<body>

        <header class="header">
            <h1>Projet Reality</h1>
        </header>
    
        <!-- Section ajoutée pour la description et le bouton -->

            <div class="menu-icon" data-background="Fond/Gartic.webp" onclick="openApp('KrungerIO.html', 'Gartic Phone', this)">
                <img src="Cover/Gartic.webp" alt="Reality Store" width="100" height="100">

            <div class="menu-icon" data-background="Fond/Gartic.webp" onclick="openApp('KrungerIO.html', 'Gartic Phone', this)">
                <img src="Cover/Gartic.webp" alt="Reality Store" width="100" height="100">
                <span class="app-name">Garticphone</span>
            </div>
            <div class="menu-icon" data-background="Fond/Gartic.webp" onclick="openApp('KrungerIO.html', 'Gartic Phone', this)">
                <img src="Cover/Gartic.webp" alt="Reality Store" width="100" height="100">
                <span class="app-name">Garticphone</span>
            </div>
            <div class="menu-icon" data-background="Fond/Gartic.webp" onclick="openApp('KrungerIO.html', 'Gartic Phone', this)">
                <img src="Cover/Gartic.webp" alt="Reality Store" width="100" height="100">

    <script>
        let zIndex = 1;
        let menuEnabled = true;
        let keyPressTimer = null;
        let buttonPressTimer = null;
        let overlayShown = false;
    
        function openApp(url, appName) {
            if (!menuEnabled) return;
    
            const appWindow = document.createElement('div');
            appWindow.className = 'fullscreen-window';
            appWindow.style.zIndex = zIndex++;
    
            appWindow.innerHTML = `
                <div class="exit-overlay hidden" id="exitOverlay">
                    <div class="exit-content">
                        <h2>Vous nous quittez ?</h2>
                        <p class="app-label">Application en cours :</p>
                        <button class="quit-app-button" onclick="confirmExit()">Quitter l’applis</button>
                    </div>
                </div>
    
                <iframe src="${url}" class="app-frame"></iframe>
                <div class="menu-dropdown" id="dropdownMenu">
                    <ul>
                        <li onclick="closeApp(this.closest('.fullscreen-window'))">Fermer le Jeu</li>
                    </ul>
                </div>
            `;
    
            document.body.appendChild(appWindow);
            menuEnabled = false;
    
            if (appWindow.requestFullscreen) {
                appWindow.requestFullscreen();
            }
    
            setupLongPressClose(appWindow);
        }
    
        function confirmExit() {
            const appWindow = document.querySelector('.fullscreen-window');
            const exitOverlay = appWindow.querySelector('#exitOverlay');
            exitOverlay.classList.remove('active');
            closeApp(appWindow);
        }
    
        function closeApp(appWindow) {
            document.body.removeChild(appWindow);
            menuEnabled = true;
            overlayShown = false;
        }
    
        function showExitOverlay() {
            const appWindow = document.querySelector('.fullscreen-window');
            if (!appWindow) return;
    
            const exitOverlay = appWindow.querySelector('#exitOverlay');
    
            if (!overlayShown) {
                exitOverlay.classList.remove('hidden');
                exitOverlay.classList.add('active');
                overlayShown = true;
            }
        }
    
        function setupLongPressClose(appWindow) {
            let pressTimer;
            const dropdownMenu = appWindow.querySelector('#dropdownMenu');
    
            // Gamepad connected
            window.addEventListener('gamepadconnected', () => {
                console.log("Manette connectée");
            });
    
            function checkRightStick() {
                const gamepads = navigator.getGamepads();
                if (gamepads[0]) {
                    const axes = gamepads[0].axes;
                    if (axes[2] > 0.5) {
                        if (!pressTimer) {
                            pressTimer = setTimeout(() => {
                                dropdownMenu.classList.add('active');
                                appWindow.style.zIndex = zIndex++;
                            }, 5000);
                        }
                    } else {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                        dropdownMenu.classList.remove('active');
                    }
                }
                requestAnimationFrame(checkRightStick);
            }
            checkRightStick();
        }
    
        // Gestion clavier - touche ²
        window.addEventListener('keydown', (e) => {
            if (e.key === "²" && !keyPressTimer) {
                keyPressTimer = setTimeout(() => {
                    console.log("Appui long touche ²");
                    showExitOverlay();
                }, 3000);
            }
        });
    
        window.addEventListener('keyup', (e) => {
            if (e.key === "²") {
                clearTimeout(keyPressTimer);
                keyPressTimer = null;
            }
        });
    
        // Gestion bouton Option (Start) de la manette
        function monitorGamepadOptionButton() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                const optionButton = gamepads[0].buttons[9];
                if (optionButton.pressed && !buttonPressTimer) {
                    buttonPressTimer = setTimeout(() => {
                        console.log("Appui long bouton Option");
                        showExitOverlay();
                    }, 3000);
                } else if (!optionButton.pressed) {
                    clearTimeout(buttonPressTimer);
                    buttonPressTimer = null;
                }
            }
            requestAnimationFrame(monitorGamepadOptionButton);
        }
    
        monitorGamepadOptionButton();
    
        // Navigation menu avec manette
        const menuIcons = document.querySelectorAll('.menu-icon');
        let currentIndex = 0;
        let isMoving = false;
    
        function changeBackground(index) {
            const background = menuIcons[index].getAttribute('data-background');
            document.body.style.backgroundImage = `url(${background})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
        }
    
        function updateSelection() {
            menuIcons.forEach((icon, index) => {
                icon.classList.toggle('selected', index === currentIndex);
                icon.style.transform = index === currentIndex ? "scale(1.15)" : "scale(0.9)";
            });
        }
    
        function hoverWithGamepad() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                const axes = gamepads[0].axes;
                const buttons = gamepads[0].buttons;
    
                if (axes[0] > 0.5 && currentIndex < menuIcons.length - 1 && !isMoving) {
                    currentIndex++;
                    changeBackground(currentIndex);
                    updateSelection();
                    isMoving = true;
                } else if (axes[0] < -0.5 && currentIndex > 0 && !isMoving) {
                    currentIndex--;
                    changeBackground(currentIndex);
                    updateSelection();
                    isMoving = true;
                } else if (Math.abs(axes[0]) < 0.2) {
                    isMoving = false;
                }
    
                if (buttons[0].pressed) {
                    const icon = menuIcons[currentIndex];
                    const url = icon.getAttribute('onclick').match(/'([^']+)'/)[1];
                    const title = icon.querySelector('span').textContent;
                    openApp(url, title);
                }
            }
        }
    
        setInterval(hoverWithGamepad, 50);
    
        // Empêche fermeture d'app si sortie plein écran
        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = document.fullscreenElement !== null;
            const appWindow = document.querySelector('.fullscreen-window');
            if (!isFullscreen && appWindow) {
                appWindow.style.zIndex = zIndex++;
                console.log("Sortie plein écran, app reste active");
            }
        });
    
        // Hover souris
        menuIcons.forEach((icon, index) => {
            icon.addEventListener('mouseenter', () => {
                currentIndex = index;
                changeBackground(currentIndex);
                updateSelection();
            });
            icon.addEventListener('mouseleave', () => {
                document.body.style.background = '';
            });
        });
    
        // Initialisation
        updateSelection();
    </script>
    
</body>
</html>
